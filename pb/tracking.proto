syntax = "proto3";

package tracking;

option go_package = "github.com/Mizuhar4/tracking-service/pb";

// ─ Mensajes ─────────────────────────────────────────────

message UpdateDriverLocationRequest {
  string delivery_id = 1;
  float latitude     = 2;
  float longitude    = 3;
}

message UpdateDriverLocationResponse {
  string delivery_id = 1;
  string updated_at  = 2;
}

message AssignDeliveryRequest {
  string order_id      = 1;
  string restaurant_id = 2;
}

message AssignDeliveryResponse {
  string assignment_id = 1;
  string order_id      = 2;
  string delivery_id   = 3;
  string status        = 4;
}

message GetOrderLocationRequest {
  string order_id = 1;
}

message GetOrderLocationResponse {
  string order_id    = 1;
  string delivery_id = 2;
  float latitude     = 3;
  float longitude    = 4;
  string last_updated = 5;
}

// ─ Servicio ─────────────────────────────────────────────

service TrackingService {
  rpc UpdateDriverLocation (UpdateDriverLocationRequest) returns (UpdateDriverLocationResponse);
  rpc AssignDelivery (AssignDeliveryRequest) returns (AssignDeliveryResponse);
  rpc GetOrderLocation (GetOrderLocationRequest) returns (GetOrderLocationResponse);
}
